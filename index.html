<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Generator</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
    <header>
    <h1>AI Vegan Recipe Generator</h1>
    </header>

    <main>
        <div class="form-container">
      <form id="recipe-generator-form">
        <input type="text" 
        placeholder="Enter the ingerdient you would like to use"
        autofocus
        required
        autocomplete="off"
        class="prompt"
        id="user-instructions"
        />
        <input type="submit" class="button"/>
      </form>
      <div class="hint">i.e Tofu, Kale, Tumeric, Chickpeas etc. </div>
        </div> 

      <div class="recipe hidden" id="recipe"></div>

    </main>

    <footer>This AI project was coded by 
        <a href="https://github.com/lou3479" target="_blank">Louise Miller</a> and is 
        <a href="https://github.com/lou3479/Vegan-recipe-generator" target="_blank">
            open-sourced on Github</a> and is hosted on 
        <a href="https://vegan-recipe-generator.netlify.app/" target="_blank"> Netlify.</a>
    </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
